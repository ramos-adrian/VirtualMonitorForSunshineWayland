name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax + shellcheck
        run: |
          bash -n virtual-monitor.sh
          shellcheck -x virtual-monitor.sh
      - name: Every profile generates a valid EDID
        run: |
          for p in profiles/*.conf; do
            VM_CONFIG="$p" ./virtual-monitor.sh gen
          done
